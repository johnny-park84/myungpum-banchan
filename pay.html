<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>계좌이체 결제 안내 | 명품반찬</title>
  <!-- 결제 안내 전용 페이지: 검색 결과에는 노출하지 않음 -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fffdf9">

  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "SUITE";
      src: url("fonts/SUITE-ExtraBold.woff2") format("woff2");
      font-weight: 800;
      font-display: swap;
    }

    /* 색은 css/style.css 와 같은 톤 */
    :root {
      --text: #3a2e25;
      --text-soft: #7a6b5d;
      --bg: #fffdf9;
      --section-bg: #f8f3ea;
      --line: #e8dfd2;
      --orange: #ec5f1f;
      --kakao: #fee500;
      --kakao-text: #191600;
      --toss: #0064ff;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans KR", sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 24px 18px calc(36px + env(safe-area-inset-bottom));
    }

    .logo { display: block; width: 190px; height: auto; margin: 0 auto 20px; }

    h1 {
      margin: 0 0 4px;
      font-family: "SUITE", "Noto Sans KR", sans-serif;
      font-weight: 800;
      font-size: 28px;
      text-align: center;
    }
    .lead { margin: 0 0 22px; text-align: center; color: var(--text-soft); font-size: 18px; }

    /* 계좌 정보 + 복사 버튼 (한 덩어리) */
    .account {
      display: block;
      width: 100%;
      margin: 0 0 12px;
      padding: 0;
      border: 2px solid var(--text);
      border-radius: 16px;
      background: var(--section-bg);
      color: var(--text);
      font: inherit;
      text-align: center;
      overflow: hidden;
      cursor: pointer;
    }
    .account:active { transform: scale(.985); }
    .account .info { display: block; padding: 18px 12px 16px; }
    .account .bank { display: block; font-size: 19px; font-weight: 700; }
    .account .number {
      display: block;
      margin: 2px 0 4px;
      font-size: 31px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: .01em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .account .holder { display: block; font-size: 18px; color: var(--text-soft); }
    .account .action {
      display: block;
      padding: 14px 12px;
      background: var(--text);
      color: #fff;
      font-size: 21px;
      font-weight: 700;
    }
    .account.is-copied .action { background: #2f7d32; }

    /* 버튼 */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 66px;
      margin: 0 0 12px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 21px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:active { transform: scale(.985); }
    .btn-kakao { background: var(--kakao); color: var(--kakao-text); }
    .btn-toss { background: var(--toss); color: #fff; }

    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 22px 0 14px;
      color: var(--text-soft); font-size: 17px;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .steps {
      margin: 22px 0 0;
      padding: 18px 18px 18px 40px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 18px;
      line-height: 1.55;
      color: var(--text-soft);
    }
    .steps li + li { margin-top: 8px; }
    .steps b { color: var(--text); }

    .notice { margin: 18px 0 0; font-size: 18px; color: var(--text-soft); text-align: center; }
    .notice a { color: var(--orange); font-weight: 700; text-decoration: none; }

    /* 복사 완료 등 안내 토스트 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      max-width: calc(100% - 40px);
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(58, 46, 37, .95);
      color: #fff;
      font-size: 18px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <a href="./"><img class="logo" src="images/logo-header.png" alt="명품반찬" width="233" height="70"></a>

    <h1>계좌이체 결제 안내</h1>
    <p class="lead">편하신 방법을 골라 결제해 주세요.</p>

    <button type="button" class="account" id="btn-copy" aria-label="계좌번호 복사">
      <span class="info">
        <span class="bank" id="bank"></span>
        <strong class="number" id="number"></strong>
        <span class="holder" id="holder"></span>
      </span>
      <span class="action" id="copy-label">눌러서 계좌번호 복사</span>
    </button>

    <div class="divider" id="divider">또는 앱으로 바로 보내기</div>

    <a class="btn btn-kakao" id="btn-kakao" href="#" hidden>카카오페이로 보내기</a>
    <a class="btn btn-toss" id="btn-toss" href="#" hidden>토스로 보내기</a>

    <ol class="steps">
      <li>위 <b>계좌번호를 눌러 복사</b>한 뒤<br>쓰시는 은행 앱을 열어 주세요.</li>
      <li>금액을 입력하고 보내주세요.</li>
      <li>이체 완료 화면을 <b>직원에게 보여주시면</b> 끝!</li>
    </ol>

    <p class="notice">문의 <a href="tel:010-4347-9919">010-4347-9919</a></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /* =========================================================
       ▼ 여기만 수정하세요 ▼
       계좌가 바뀌어도 이 값만 고치면 되고, 인쇄한 QR 코드는 그대로 쓸 수 있어요.
       ========================================================= */
    const PAY = {
      bankName:  "NH농협은행",          // 화면에 보일 은행 이름 (예: "KB국민은행")
      account:   "356-1125-7577-83",   // 계좌번호 (하이픈 있어도 됨)
      holder:    "김민경",          // 예금주

      // 카카오페이 송금코드 링크 (카카오페이 → 송금 → 송금코드 → 공유 → 링크 복사)
      // 비워 두면("") 카카오페이 버튼이 숨겨집니다.
      kakaoPayUrl: "https://qr.kakaopay.com/Ej8U1Ba6a",

      // 토스 송금 버튼에 쓸 은행 이름 (토스 앱이 인식하는 짧은 이름, 예: "국민", "신한", "농협", "우리", "하나")
      // 비워 두면("") 토스 버튼이 숨겨집니다.
      tossBankName: "농협"
    };
    /* ========================================================= */

    const $ = (id) => document.getElementById(id);
    const digits = PAY.account.replace(/[^0-9]/g, "");
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    // 계좌 정보 표시
    $("bank").textContent = PAY.bankName;
    $("number").textContent = PAY.account;
    $("holder").textContent = "예금주 " + PAY.holder;

    // 안내 토스트
    let toastTimer;
    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    // 계좌번호 복사 (은행 앱이 인식하기 쉽게 "은행명 계좌번호" 형태로)
    async function copyAccount() {
      const text = PAY.bankName + " " + PAY.account;
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        // 일부 인앱 브라우저용 예비 방법
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e2) {}
        document.body.removeChild(ta);
      }
      const btn = $("btn-copy");
      btn.classList.add("is-copied");
      $("copy-label").textContent = "✓ 복사됐어요";
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => {
        btn.classList.remove("is-copied");
        $("copy-label").textContent = "눌러서 계좌번호 복사";
      }, 4000);
    }
    let copyTimer;
    $("btn-copy").addEventListener("click", copyAccount);

    // 카카오페이
    if (PAY.kakaoPayUrl) {
      const k = $("btn-kakao");
      k.href = PAY.kakaoPayUrl;
      k.hidden = false;
    }

    // 토스 (휴대폰에서만 표시)
    if (PAY.tossBankName && isMobile) {
      const t = $("btn-toss");
      t.href = "supertoss://send?bank=" + encodeURIComponent(PAY.tossBankName) +
               "&accountNo=" + digits;
      t.hidden = false;
      t.addEventListener("click", () => {
        // 앱이 열리지 않으면(미설치 등) 계좌번호를 대신 복사해 둠
        const timer = setTimeout(() => {
          if (!document.hidden) copyAccount();
        }, 1800);
        document.addEventListener("visibilitychange", () => clearTimeout(timer), { once: true });
      });
    }

    // 앱 버튼이 하나도 없으면 구분선도 숨김
    if ($("btn-kakao").hidden && $("btn-toss").hidden) $("divider").hidden = true;
  </script>
</body>
</html>
