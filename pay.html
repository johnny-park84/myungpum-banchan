<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>계좌이체 결제 안내 | 명품반찬</title>
  <!-- 결제 안내 전용 페이지: 검색 결과에는 노출하지 않음 -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fffdf9">

  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "SUITE";
      src: url("fonts/SUITE-ExtraBold.woff2") format("woff2");
      font-weight: 800;
      font-display: swap;
    }

    /* 색은 css/style.css 와 같은 톤 */
    :root {
      --text: #3a2e25;
      --text-soft: #7a6b5d;
      --bg: #fffdf9;
      --section-bg: #f8f3ea;
      --line: #e8dfd2;
      --orange: #ec5f1f;
      --kakao: #fee500;
      --kakao-text: #191600;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans KR", sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 24px 16px calc(36px + env(safe-area-inset-bottom));
    }

    .logo { display: block; width: 190px; height: auto; margin: 4px auto 20px; }
    /* 화면에는 안 보이고 화면 읽기 프로그램만 읽는 제목 */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    h1 {
      margin: 0 0 18px;
      font-family: "SUITE", "Noto Sans KR", sans-serif;
      font-weight: 800;
      font-size: 28px;
      text-align: center;
    }
    h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
    }
    .sub { margin: 2px 0 14px; text-align: center; color: var(--text-soft); font-size: 17px; }

    /* 계좌 정보: 흰 카드 + 옅은 그림자 */
    .account {
      margin: 0 0 12px;
      padding: 22px 12px 18px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(58, 46, 37, .05), 0 4px 22px rgba(58, 46, 37, .14);
      text-align: center;
    }
    .account .bank { display: block; font-size: 19px; font-weight: 700; }
    .account .number {
      display: block;
      margin: 2px 0 4px;
      font-size: 31px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: .01em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .account .holder { display: block; font-size: 19px; font-weight: 700; color: var(--text); }
    .account .holder .label { font-weight: 400; color: var(--text-soft); margin-right: 4px; }

    /* 카카오페이 버튼 */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 64px;
      margin: 0;
      padding: 0 16px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 21px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:active { transform: scale(.985); }
    .btn-kakao { background: var(--kakao); color: var(--kakao-text); }

    /* 은행 선택 */
    .banks {
      margin: 22px 0 0;
      padding: 18px 8px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
    }
    .bank-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .bank-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      width: 100%;
      padding: 10px 2px 8px;
      border: 0;
      border-radius: 14px;
      background: none;
      color: var(--text);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    .bank-btn img {
      display: block;
      width: 70px;
      height: 70px;
      border-radius: 18px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .08);
      background: #fff;
    }
    .bank-btn:active { transform: scale(.96); background: var(--section-bg); }

    .more-toggle {
      display: block;
      width: 100%;
      margin: 10px 0 0;
      padding: 14px;
      border: 1px dashed var(--text-soft);
      border-radius: 12px;
      background: none;
      color: var(--text);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    #more-banks { margin-top: 10px; }

    .steps {
      margin: 22px 0 0;
      padding: 18px 18px 18px 40px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 18px;
      line-height: 1.55;
      color: var(--text-soft);
    }
    .steps li + li { margin-top: 8px; }
    .steps b { color: var(--text); }

    .notice { margin: 18px 0 0; font-size: 18px; color: var(--text-soft); text-align: center; }
    .notice a { color: var(--orange); font-weight: 700; text-decoration: none; }

    /* 앱이 안 열렸을 때 등 안내 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      width: calc(100% - 32px);
      max-width: 408px;
      padding: 16px 18px;
      border-radius: 14px;
      background: rgba(58, 46, 37, .96);
      color: #fff;
      font-size: 18px;
      line-height: 1.5;
      text-align: center;
      white-space: pre-line;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <a href="./"><img class="logo" src="images/logo-header.png" alt="명품반찬" width="233" height="70"></a>

    <h1 class="sr-only">명품반찬 계좌이체 결제 안내</h1>

    <section class="account" aria-label="입금 계좌">
      <span class="bank" id="bank"></span>
      <strong class="number" id="number"></strong>
      <span class="holder" id="holder"></span>
    </section>

    <a class="btn btn-kakao" id="btn-kakao" href="#" hidden>카카오페이로 보내기</a>

    <section class="banks" aria-labelledby="banks-title">
      <h2 id="banks-title">이체할 은행을 선택해주세요</h2>
      <p class="sub">계좌번호가 복사되고 은행 앱이 열려요</p>
      <ul class="bank-grid" id="main-banks"></ul>
      <button type="button" class="more-toggle" id="more-toggle" aria-expanded="false" aria-controls="more-banks">다른 은행 더 보기 ▾</button>
      <ul class="bank-grid" id="more-banks" hidden></ul>
    </section>

    <ol class="steps">
      <li>위에서 <b>이체할 은행</b>을 누르면 은행 앱이 열려요.</li>
      <li>받는 분 계좌에 <b>붙여넣기</b>를 하고 금액을 입력해 보내주세요.<br>(복사한 계좌가 자동으로 뜨면 그걸 눌러도 돼요)</li>
      <li>이체 완료 화면을 <b>직원에게 보여주시면</b> 끝!</li>
    </ol>

    <p class="notice">문의 <a href="tel:010-4347-9919">010-4347-9919</a></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /* =========================================================
       ▼ 여기만 수정하세요 ▼
       계좌가 바뀌어도 이 값만 고치면 되고, 인쇄한 QR 코드는 그대로 쓸 수 있어요.
       ========================================================= */
    const PAY = {
      bankName:  "NH농협은행",          // 화면에 보일 은행 이름 (예: "KB국민은행")
      account:   "356-1125-7577-83",   // 계좌번호 (하이픈 있어도 됨)
      holder:    "김민경",               // 예금주

      // 카카오페이 송금코드 링크 (카카오페이 → 송금 → 송금코드 → 공유 → 링크 복사)
      // 비워 두면("") 카카오페이 버튼이 숨겨집니다.
      kakaoPayUrl: "https://qr.kakaopay.com/Ej8U1Ba6a",

      // 토스로 보낼 때 받는 은행 이름 (토스 앱이 인식하는 짧은 이름, 예: "국민", "신한", "농협")
      tossBankName: "농협"
    };
    /* ========================================================= */

    const $ = (id) => document.getElementById(id);
    const digits = PAY.account.replace(/[^0-9]/g, "");
    const ua = navigator.userAgent;
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    /* 은행 앱 목록
       app:  앱을 여는 주소 (안드로이드·아이폰 공통, 아이폰만 다르면 ios 에 따로 적음)
       pkg:  안드로이드 앱 이름 (앱이 없으면 플레이스토어로 이동)
       icon: images/banks/ 안의 아이콘 파일 이름 (구글 플레이스토어의 각 은행 공식 앱 아이콘)
       아이폰 주소 중 확인되지 않은 것은 열리지 않을 수 있어요. 그래도 계좌번호는 복사돼 있어요. */
    const TOSS = "supertoss://send?bank=" + encodeURIComponent(PAY.tossBankName) + "&accountNo=" + digits;
    const MAIN_BANKS = [
      { name: "국민은행",     icon: "kb", app: "kbbank://call", ios: "kbbank://",            pkg: "com.kbstar.kbbank" },
      { name: "신한은행",     icon: "shinhan", app: "shinhansol://", ios: "shinhanSol://",        pkg: "com.shinhan.sbanking" },
      { name: "우리은행",     icon: "woori", app: "wooribank://",  ios: "NewSmartPib://",       pkg: "com.wooribank.smart.npib" },
      { name: "하나은행",     icon: "hana", app: "hanabank-oqf://",                            pkg: "com.hanabank.oqf" },
      { name: "NH 스마트뱅킹", icon: "nh-smart", app: "newnhsmartbanking://",                     pkg: "nh.smart.banking" },
      { name: "NH콕뱅크",     icon: "nh-cok", app: "nhcok://",                                   pkg: "nh.smart.nhcok" },
      { name: "IBK기업",      icon: "ibk", app: "ionebank://",                                pkg: "com.ibk.android.ionebank" },
      { name: "카카오뱅크",   icon: "kakaobank", app: "kakaobank://",                               pkg: "com.kakaobank.channel" },
      { name: "토스",         icon: "toss", app: TOSS,                                         pkg: "" },
      { name: "케이뱅크",     icon: "kbank", app: "ukbanksmartbankshortcut://", ios: "ukbanksmartbankrelay://", pkg: "com.kbankwith.smartbank" },
      { name: "SC제일",       icon: "sc", app: "scbmobile://",                               pkg: "com.scbank.ma30" },
      { name: "씨티은행",     icon: "citi", app: "citimobileapp://smartpay",                   pkg: "kr.co.citibank.citimobile" }
    ];
    const MORE_BANKS = [
      { name: "우체국",       icon: "epost", app: "com.epost.psf.sd://",                        pkg: "com.epost.psf.sdsi" },
      { name: "새마을금고",   icon: "mg", app: "kfccsb://",                                  pkg: "com.smg.spbs" },
      { name: "신협",         icon: "cu", app: "cuonbank://onbank.cu.co.kr?SCHEME_ACTION=REQUEST_SCHEME_WIDGET_TRANSFER&SCHEME_PARAM=", pkg: "kr.co.cu.onbank" },
      { name: "SBI 저축은행",  icon: "sbi", app: "sbi://sbi_url",                              pkg: "com.sbi.saidabank" },
      { name: "부산은행",     icon: "busan", app: "bslink://call",                              pkg: "kr.co.busanbank.mbp" },
      { name: "경남은행",     icon: "kyongnam", app: "alopex://psb",                               pkg: "com.knb.psb" },
      { name: "광주은행",     icon: "kwangju", app: "kjbank://asb",                               pkg: "com.kjbank.asb.pbanking" },
      { name: "전북은행",     icon: "jeonbuk", app: "jbprivatebank://",                           pkg: "kr.co.jbbank.privatebank" },
      { name: "제주은행",     icon: "jeju", app: "newjbanksmart://action",                     pkg: "com.jejubank.smartnew" },
      { name: "iM뱅크",       icon: "im", app: "mbanking://open",                            pkg: "kr.co.dgb.dgbm" },
      { name: "산업은행",     icon: "kdb", app: "smartkdbnvs://",                             pkg: "co.kr.kdb.android.smartkdb" },
      { name: "수협은행",     icon: "suhyup", app: "suhyuppsmb://suhyuplink",                    pkg: "com.suhyup.psmb" }
    ];

    // 계좌 정보 표시
    $("bank").textContent = PAY.bankName;
    $("number").textContent = PAY.account;
    $("holder").innerHTML = '<span class="label">예금주</span>';
    $("holder").append(PAY.holder);

    // 안내 문구
    let toastTimer;
    function toast(msg, ms) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), ms || 3500);
    }

    // 계좌번호 복사 (은행 앱이 인식하기 쉽게 "은행명 계좌번호" 형태로)
    function copyAccount() {
      const text = PAY.bankName + " " + PAY.account;
      let done = false;
      // 앱으로 넘어가기 전에 확실히 복사되도록 동기 방식부터 시도
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        done = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (e) {}
      if (!done && navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    }

    // 앱 여는 주소 만들기
    function appUrl(b) {
      if (isAndroid) {
        // kbbank://call → intent://call#Intent;scheme=kbbank;package=...;end
        const i = b.app.indexOf("://");
        const scheme = b.app.slice(0, i);
        const rest = b.app.slice(i + 3);
        let url = "intent://" + rest + "#Intent;scheme=" + scheme + ";";
        if (b.pkg) {
          url += "package=" + b.pkg + ";S.browser_fallback_url=" +
                 encodeURIComponent("https://play.google.com/store/apps/details?id=" + b.pkg) + ";";
        }
        return url + "end";
      }
      return b.ios || b.app;
    }

    // 은행 버튼 누르면: 계좌번호 복사 → 은행 앱 열기
    function openBank(b) {
      copyAccount();
      if (!isAndroid && !isIOS) {
        toast("계좌번호가 복사되었어요.\n휴대폰에서 은행 앱을 열어 보내주세요.");
        return;
      }
      toast("계좌번호가 복사되었어요");
      const timer = setTimeout(() => {
        if (!document.hidden) {
          toast(b.name.replace("\n", " ") + " 앱이 열리지 않았어요.\n계좌번호가 복사되었으니 은행 앱을 직접 열어주세요.", 5000);
        }
      }, 2000);
      document.addEventListener("visibilitychange", () => clearTimeout(timer), { once: true });
      window.location.href = appUrl(b);
    }

    function renderBanks(list, ul) {
      list.forEach((b) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "bank-btn";
        const img = document.createElement("img");
        img.src = "images/banks/" + b.icon + ".png";
        img.alt = "";
        img.width = 70;
        img.height = 70;
        img.loading = "lazy";
        const label = document.createElement("span");
        label.textContent = b.name.replace("\n", " ");
        btn.append(img, label);
        btn.addEventListener("click", () => openBank(b));
        li.appendChild(btn);
        ul.appendChild(li);
      });
    }
    renderBanks(MAIN_BANKS, $("main-banks"));
    renderBanks(MORE_BANKS, $("more-banks"));

    $("more-toggle").addEventListener("click", () => {
      const more = $("more-banks");
      const open = more.hidden;
      more.hidden = !open;
      $("more-toggle").setAttribute("aria-expanded", String(open));
      $("more-toggle").textContent = open ? "접기 ▴" : "다른 은행 더 보기 ▾";
    });

    // 카카오페이
    if (PAY.kakaoPayUrl) {
      const k = $("btn-kakao");
      k.href = PAY.kakaoPayUrl;
      k.hidden = false;
    }
  </script>
</body>
</html>
